# =============================================================================
# G1 app-core (nRF5340 application core) prj.conf  —  STEP 3c finalized
#
# Derived by reconciling the validated harvest config
# (~/ncs251/refapp/prj.conf) against the actual subsystems reconstructed in
# recon/modules/. Purpose is unchanged: enable exactly the library modules the
# G1 app core links so their compiled object code can be opcode-signature
# matched against the shipped image. Every option carries the module / evidence
# that requires it. Options whose evidence is indirect are flagged NOTE.
#
# Build for size to match the shipped image (NCS default is -Os anyway).
CONFIG_SIZE_OPTIMIZATIONS=y

# --- Bluetooth host: peripheral + central + GATT client/server + ANCS --------
# ble_proto: terminates the phone<->glasses GATT protocol, owns BT/SMP security
#   callbacks (bt_send_enabled, check_bonded_addr, pairing_failed, auth_cancel,
#   indicate_sc_cb @0x17e3c..0x18a38).  Peripheral role = advertises to phone.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
# ancs_notify: acts as ANCS *GATT client* on iOS (bt_ancs_data_source_handler
#   @0x18c48); battery module groups peer GATT-link helpers -> central role.
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
# ancs_notify uses GATT Discovery Manager to find the ANCS service on the phone.
CONFIG_BT_GATT_DM=y
# ble_proto registers app services dynamically at runtime (dynamic DB).
CONFIG_BT_GATT_DYNAMIC_DB=y
# ble_proto security callbacks + bonding (check_bonded_addr, pairing_failed).
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
# misc: bt_settings_store (FUN_00052f68) persists bonds -> BT settings backend.
CONFIG_BT_SETTINGS=y
# ancs_notify: dedicated Apple ANCS client library.
CONFIG_BT_ANCS_CLIENT=y
CONFIG_BT_DEVICE_NAME="g1ref"

# --- Persistent storage: settings + NVS + flash map --------------------------
# flash_store.sett_init (@0x22518) = "Zephyr settings subsys init + register";
#   combined with CONFIG_BT_SETTINGS this pulls settings-over-NVS for BT bonds.
#   NOTE: the firmware's *primary* user-data store is a custom external-flash
#   store (flash_store: ext_flash_read/write @0x2e398/0x2e440), NOT Zephyr NVS.
#   NVS/SETTINGS here exist mainly to back BT_SETTINGS.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
# External QSPI NOR: audio symbol cluster shows nrfx_qspi linked; flash_store
#   drives an external SPI/QSPI NOR part (g_ext_flash_dev @0x20007b68).
#   NOTE: flash_store installs its OWN read/write/erase fn pointers, so the
#   shipped ext-flash driver may be a bespoke SPI-NOR path rather than the
#   Zephyr nordic_qspi_nor driver. Kept for QSPI-peripheral code coverage.
CONFIG_NORDIC_QSPI_NOR=y

# --- Dual-core IPC (application core <-> network/radio core) ------------------
# ipc_core: thin wrapper over ipc_service/RPMsg endpoint 0 (ipc0_ept_recv
#   @0x25a48, global_ipc_service_send @0x25b78 -> ipc_service_send, reboots on
#   failure). MBOX is the RPMsg signalling transport.
CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y

# --- Crypto (payload cipher on the BLE path) ---------------------------------
# ble_proto: outbound-payload cipher wrapper FUN_00019b54 -> FUN_0002af4c, plus
#   PKCS#7 padding (subcontracing_send_data_pkcs7 @0x21a40). CC3XX is the
#   nRF5340 hardware crypto engine.
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS=y
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=y

# --- Audio capture: PDM microphone + LC3 encode ------------------------------
# audio: captures from the on-glasses DMIC via the nRF PDM peripheral, driven
#   DIRECTLY through nrfx_pdm (nrfx_pdm_init/start/stop/buffer_set in FUN_5ffa4/
#   FUN_5fc7c/FUN_5fb30/FUN_5fb8c), with k_mem_slab DMA buffers + a k_msgq.
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
# The capture path calls nrfx_pdm_* directly (not the Zephyr dmic_ API), so
#   enable the nrfx PDM driver explicitly to guarantee those exact symbols are
#   built for signature matching.
CONFIG_NRFX_PDM=y
# audio: LC3 encode of captured blocks (lc3_encode_frame). The nrfxlib LC3
#   library only builds when SW_CODEC_LC3_T2_SOFTWARE is set, and that symbol
#   depends on FP_HARDABI (hence CONFIG_FP_HARDABI below).
#   NOTE: high-value harvest target (libLC3.a). Confirm the shipped codec is the
#   nrfxlib T2 LC3 and not a third-party LC3 before trusting these signatures.
CONFIG_SW_CODEC_LC3_T2_SOFTWARE=y
CONFIG_FP_HARDABI=y

# --- Buses + analog ----------------------------------------------------------
# battery: fuel gauge + OPT3007 ambient-light sensor over I2C (opt3007_chip_init
#   @0x2e67c verifies mfg id 0x5449). imu_motion: IMU over I2C.
CONFIG_I2C=y
# esb_sync: lens-to-lens sync uses SPI full-duplex (spi_master_trans_data_tx_rx)
#   staged through a shared-SRAM mailbox. display: reflash_fb_data_to_lcd blits
#   the canvas to the JBD panel over SPI.
CONFIG_SPI=y
# misc: adc_context_start_sampling (FUN_00083778 @0x83778) -> SAADC linked
#   (likely battery/analog rail sensing).
#   NOTE: only the driver core is visible in the graph; no app-level adc_* call
#   was found. Kept for SAADC code coverage; low confidence.
CONFIG_ADC=y
# gpio: touch IRQ line + SW0 button (touch_key_gpio_isr @0x1793c, read_sw0_pin),
#   panel/mic/IMU power-rail enables (display power_for_panel, audio mic rail).
CONFIG_GPIO=y

# --- Sensors -----------------------------------------------------------------
# NOTE: UNSURE — no Zephyr sensor API (sensor_sample_fetch/sensor_channel_get)
#   is called anywhere in recon/modules. The fuel gauge, OPT3007 and IMU are all
#   driven by raw I2C register reads (i2c_read_reg16_be etc.), so CONFIG_SENSOR
#   likely contributes NO matchable code. Retained only because it was in the
#   validated refapp build; a candidate to drop in a later pass.
CONFIG_SENSOR=y

# --- Kernel features the firmware uses ---------------------------------------
# system: global event fan-out (send_event @0x276ec). Zephyr k_event objects.
CONFIG_EVENTS=y
# Heap sized to match refapp; many modules alloc-init k_msgq buffers at runtime
#   (audio z_impl_k_msgq_alloc_init, ipc_core UID pipe) off the system heap.
CONFIG_HEAP_MEM_POOL_SIZE=16384
# ble_proto/translate log path, async UART and BT host use ring buffers.
#   NOTE: no direct ring_buf_* call surfaced in module docs; indirect. Low conf.
CONFIG_RING_BUFFER=y
# Logging: g_log_level (@0x2000230c), DEBUG_PRINT sink (ble_proto, translate),
#   printk-fronted driver logs (misc).
CONFIG_LOG=y
CONFIG_PRINTK=y
# Firmware logs floats/percentages -> printf float support.
CONFIG_CBPRINTF_FP_SUPPORT=y
# FPU on for the M33; also required by the LC3 hard-ABI codec above.
CONFIG_FPU=y
# ipc_core / touch_key / system: sys_reboot on IPC-fatal, factory-reset, and
#   PTP_DEVICE_RESTART (FUN_0004c0a8).
CONFIG_REBOOT=y
# system: device identity / reset-cause; hwinfo used for SN / reset reporting.
CONFIG_HWINFO=y
# ble_proto/system: watchdog feed + disable_watchdog (@0x2aeb4, wdt device
#   @0x87cc8); system owns the watchdog (wdt_ in system/wiring.md).
CONFIG_WATCHDOG=y

# --- Removed / intentionally ABSENT ------------------------------------------
# CONFIG_ESB is NOT set. Despite the module name "esb_sync", the app core does
#   NOT run the Nordic Enhanced ShockBurst radio: the L/R lens transport is a
#   shared-SRAM mailbox clocked over SPI (spi_master_trans_data_tx_rx), and the
#   ESB *radio* lives on the network core (a separate image). esb_channel_number
#   is only factory-provisioning metadata handed to the net core. Enabling
#   CONFIG_ESB here would harvest signatures for code that this core never links.
#
# CONFIG_PWM / CONFIG_I2S: dropped vs a generic template — no PWM or I2S usage
#   was found in any module (panel brightness is a register write over the panel
#   bus, not a PWM peripheral).
#
# NOTE (uncertain, not enabled): a uart_callback (ancs_notify @0x33384) and
#   nrfx_uarte appear in the symbol clusters, implying a UART (NFC/EEPROM link
#   or debug console). If a later harvest pass needs those symbols, add
#   CONFIG_SERIAL=y (+ CONFIG_UART_ASYNC_API=y). Left off for now because the
#   log backend target (UART vs RTT) is unconfirmed.
