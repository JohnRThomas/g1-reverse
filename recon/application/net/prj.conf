# G1 CPUNET: standalone HCI-RPMsg/SoftDevice Controller build shell.
# Target: nrf5340dk_nrf5340_cpunet (Cortex-M33, soft-float).

CONFIG_SIZE_OPTIMIZATIONS=y

# The shipped image retains Zephyr's API argument assertions (for example the
# two __ASSERT_NO_MSG checks in k_work_init).
CONFIG_ASSERT=y
CONFIG_ASSERT_NO_COND_INFO=y

# The shipped image uses deferred Zephyr logging and routes printk through the
# logging backend.  This selects the exact NCS v2.5.1 log_msg.c owner recovered
# at 0x0102e284; the reconstruction is excluded only when that SDK owner is
# present in the build.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_FRONTEND=n
CONFIG_LOG_PRINTK=y

# HCI transport to the application core.
CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_HCI_RAW_RESERVE=1
CONFIG_IPC_SERVICE=y
CONFIG_IPC_SERVICE_BACKEND_RPMSG=y
CONFIG_MBOX=y

# CPUNET is the OpenAMP remote/device endpoint.  Building both roles retains a
# host-only branch in rpmsg_virtio_get_buffer_size which is absent from the
# shipped firmware.
CONFIG_OPENAMP_MASTER=n
CONFIG_OPENAMP_SLAVE=y

# Exact NCS v2.5.1 multirole SoftDevice Controller archive selection.
CONFIG_BT_LL_SOFTDEVICE=y
CONFIG_BT_LL_SOFTDEVICE_BUILD_TYPE_LIB=y
CONFIG_BT_LL_SOFTDEVICE_MULTIROLE=y
# BT_CTLR_LE_ENC_SUPPORT is hidden and selected by BT_LL_SOFTDEVICE.
CONFIG_BT_CTLR_LE_ENC=y

# AES primitive used by the controller/CCM path.
CONFIG_TINYCRYPT=y
CONFIG_TINYCRYPT_AES=y

# Values inherited from the NCS v2.5.1 hci_rpmsg image baseline.
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
CONFIG_BT_MAX_CONN=16
CONFIG_BT_BUF_CMD_TX_COUNT=10

# The shipped net image exposes one RTC system channel plus one user channel.
# This makes CHAN_COUNT=2 in Zephyr's nrf_rtc_timer.c and selects the exact
# rtc_nrf_isr implementation at firmware VA 0x010315f0.
CONFIG_NRF_RTC_TIMER_USER_CHAN_COUNT=1
