# G1 CPUNET: standalone HCI-RPMsg/SoftDevice Controller build shell.
# Target: nrf5340dk_nrf5340_cpunet (Cortex-M33, soft-float).

CONFIG_SIZE_OPTIMIZATIONS=y

# CPUNET executes the shipped payload through the nRF53 network-core runtime
# alias, 0x800 bytes above the analysis coordinate used by netcore_image.bin.
# The raw payload is catalogued at 0x01008000; its linked/runtime origin is
# therefore 0x01008800.  Keep this offset explicit so clean Zephyr links do not
# silently fall back to the board default 0x01000000.
CONFIG_FLASH_LOAD_OFFSET=0x8800

# The shipped image retains Zephyr's API argument assertions (for example the
# two __ASSERT_NO_MSG checks in k_work_init).
CONFIG_ASSERT=y
CONFIG_ASSERT_NO_COND_INFO=y
CONFIG_ASSERT_NO_MSG_INFO=y

# Firmware k_spinlock objects carry the owner word used by
# z_spin_lock_valid/z_spin_unlock_valid/z_spin_lock_set_owner.  This also makes
# struct onoff_manager exactly 0x20 bytes and k_msgq_init exactly 40 bytes.
# SMP is independently ruled out: it would grow onoff_manager to 0x24.
CONFIG_SPIN_VALIDATE=y
CONFIG_SMP=n

# The shipped kernel thread ABI places arch.swap_return_value at offset 0x90.
# With this Zephyr revision, the 20-byte thread-name field is the difference
# from the otherwise identical 0x7c CPUNET shell layout.
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MAX_NAME_LEN=20

# The shipped image uses deferred Zephyr logging and routes printk through the
# logging backend.  This selects the exact NCS v2.5.1 log_msg.c owner recovered
# at 0x0102e284; the reconstruction is excluded only when that SDK owner is
# present in the build.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_FRONTEND=n
CONFIG_LOG_PRINTK=y

# HCI transport to the application core.
CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_HCI_RAW_RESERVE=1
CONFIG_IPC_SERVICE=y
CONFIG_IPC_SERVICE_BACKEND_RPMSG=y
CONFIG_MBOX=y

# CPUNET is the OpenAMP remote/device endpoint.  Building both roles retains a
# host-only branch in rpmsg_virtio_get_buffer_size which is absent from the
# shipped firmware.
CONFIG_OPENAMP_MASTER=n
CONFIG_OPENAMP_SLAVE=y

# Exact NCS v2.5.1 multirole SoftDevice Controller archive selection.
CONFIG_BT_LL_SOFTDEVICE=y
CONFIG_BT_LL_SOFTDEVICE_BUILD_TYPE_LIB=y
CONFIG_BT_LL_SOFTDEVICE_MULTIROLE=y
# BT_CTLR_LE_ENC_SUPPORT is hidden and selected by BT_LL_SOFTDEVICE.
CONFIG_BT_CTLR_LE_ENC=y

# The original iterable log-constant table contains the stock `esb`,
# `NRFX_TIMER`, `NRF_RPC`, `NRF_RPC_CBOR`, `NRF_RPC_OS`, and `nrf_rpc_ipc`
# owners.  ESB shares the network-core radio with the full SDC/MPSL build, so
# it must use dynamic direct IRQ attachment; the default static-IRQ choice
# selects the mutually incompatible MPSL_FEM_ONLY configuration.
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_DYNAMIC_DIRECT_INTERRUPTS=y
CONFIG_ESB=y
CONFIG_ESB_DYNAMIC_INTERRUPTS=y
CONFIG_NRF_RPC=y

# The product ESB path opens one MPSL timeslot session.  The original static
# timeslot worker has exactly one session-id slot and enqueues one OPEN before
# its first REQUEST; zero sessions makes that shipped startup path fail.
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1

# AES primitive used by the controller/CCM path.
CONFIG_TINYCRYPT=y
CONFIG_TINYCRYPT_AES=y

# Values inherited from the NCS v2.5.1 hci_rpmsg image baseline.
CONFIG_HEAP_MEM_POOL_SIZE=8192
# The shipped sys_heap helpers retain the runtime small-vs-big header branch
# (for example chunk_header_bytes() tests h->end_chunk against 0x8000).  The
# default SMALL_ONLY choice constant-folds that branch and does not match.
CONFIG_SYS_HEAP_AUTO=y
CONFIG_MAIN_STACK_SIZE=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
CONFIG_BT_MAX_CONN=16
CONFIG_BT_BUF_CMD_TX_COUNT=10

# The shipped net image exposes one RTC system channel plus one user channel.
# This makes CHAN_COUNT=2 in Zephyr's nrf_rtc_timer.c and selects the exact
# rtc_nrf_isr implementation at firmware VA 0x010315f0.
CONFIG_NRF_RTC_TIMER_USER_CHAN_COUNT=1
