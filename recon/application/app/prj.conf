# Reviewed upstream ownership selections for the CPUAPP image.
#
# The broader hardware/subsystem evidence remains in ../../board/prj.conf and
# is loaded first by CMakeLists.txt.  This fragment records only the adoption
# boundary established by recon/ownership/adoption_manifest.json.

# Pinned Zephyr liblc3 (modules/lib/liblc3 @ 448f3de).  Its module CMake owns
# the required -O3 -std=c11 -ffast-math flags; do not compile codec files here.
CONFIG_LIBLC3=y
CONFIG_FPU=y
CONFIG_FP_HARDABI=y
# CONFIG_SW_CODEC_LC3_T2_SOFTWARE is not set

# Confirmed firmware C library/toolchain pairing (GCC 12.2 + newlib-nano).
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y
# CONFIG_PICOLIBC is not set

# The shipped nrfx PDM bodies contain Zephyr's full __ASSERT_NO_MSG lowering
# (including source line metadata).  This is part of the recovered firmware
# configuration, not merely a debug preference: compiling the pinned driver
# without it changes nrfx_pdm_init/start/stop semantics and therefore forbids
# the atomic upstream PDM adoption recorded by the ownership manifest.
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2
# These three values are a single recovered kernel-layout/configuration fact.
# Spin validation accounts for the shipped lock-owner checks.  TLS-off plus
# custom thread data reproduces the firmware's thread/member offsets exactly.
CONFIG_SPIN_VALIDATE=y
# Exact bt_conn_send_cb bytes prove that current-thread lookup is the stock
# z_current_get() call, not the z_tls_current fast path.
# CONFIG_THREAD_LOCAL_STORAGE is not set
# CONFIG_ERRNO_IN_TLS is not set
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_THREAD_CUSTOM_DATA=y

# Public SDK residue promotion is machine-gated by
# recon/catalogs/app_sdk_public_ownership.json.  IPC_SERVICE and the Bluetooth
# feature owners are selected in ../../board/prj.conf; make the OpenAMP and
# libmetal source owners explicit here because their public exports now satisfy
# recovered calls directly.  Kernel timer/sys-clock symbols are promptless or
# core defaults and are therefore verified in the generated .config, not
# assigned illegally in this fragment.
CONFIG_OPENAMP=y
CONFIG_LIBMETAL=y

# Pinned TinyCrypt primitive set (modules/crypto/tinycrypt @ 3e9a49d).
CONFIG_TINYCRYPT=y
CONFIG_TINYCRYPT_AES=y
CONFIG_TINYCRYPT_AES_CMAC=y
CONFIG_TINYCRYPT_SHA256=y
CONFIG_TINYCRYPT_SHA256_HMAC=y
CONFIG_TINYCRYPT_SHA256_HMAC_PRNG=y

# Zephyr Bluetooth host crypto implementations adopted by the manifest.
# BT_HCI_HOST and BT_HOST_CRYPTO are derived from CONFIG_BT; BT_CRYPTO is
# selected by BT_SMP.  They are intentionally not assigned here because all
# three are promptless symbols in Zephyr 3.4.99.
CONFIG_BT_SMP=y

# Exact Bluetooth host fingerprint.  These values jointly reproduce the
# shipped hci_core/att/l2cap/gatt/conn/keys source units from Zephyr
# v3.4.99-ncs1-1.  Pool cardinalities and structure offsets are observable in
# the firmware; role/config choices are additionally instruction-exact at the
# public owner boundaries recorded by the adoption receipt.
CONFIG_BT_PERIPHERAL=y
# CONFIG_BT_CENTRAL is not set
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_ID_MAX=1
# CONFIG_BT_PRIVACY is not set
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_ATT_PREPARE_COUNT=1
# CONFIG_BT_L2CAP_SEG_RECV is not set
# Exact hci_tx_thread bytes and bt_dev field offsets prove that tracing is
# disabled.  Enabling it appends tracking fields to k_sem/k_queue and shifts
# bt_dev.ncmd_sem, sent_cmd, cmd_tx_queue, and drv away from firmware offsets.
# CONFIG_TRACING is not set
# CONFIG_THREAD_MONITOR is not set
# CONFIG_THREAD_NAME is not set

# Normal NCS nRF Security/CC312 integration.  These symbols select the correct
# Cortex-M33 hard-float/no-interrupts archive through nrfxlib; no archive path
# or individual vendor source is added to target_sources().
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS_LIBRARY_NRF_SECURITY=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_CORE_OBERON=y
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=y
CONFIG_NRF_CC3XX_PLATFORM=y

# Binary-derived root topology (recon/catalogs/app_root_inventory.json).
# These selections reproduce stock SYS_INIT/device/ISR owners present in the
# shipped image; they are not generic feature guesses.
CONFIG_POSIX_API=y
CONFIG_PM_DEVICE=y
CONFIG_BOARD_ENABLE_CPUNET=y
CONFIG_BT_RPMSG=y
CONFIG_BT_LONG_WQ=y
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y
# The original PRE_KERNEL_2 table contains only nrf_rtc_timer; xoshiro would
# add a second initializer.
# CONFIG_XOSHIRO_RANDOM_GENERATOR is not set

# Projector SPIM3/SPIM4 are direct nrfx users.  Their two vector veneers are
# present, while no Zephyr SPI device descriptor exists.
CONFIG_NRFX_SPIM3=y
CONFIG_NRFX_SPIM4=y

# Exact nPM1300/ALS/PDM stock device closure from the 26-entry descriptor table.
CONFIG_MFD_NPM1300=y
CONFIG_GPIO_NPM1300=y
CONFIG_WDT_NPM1300=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM1300=y
CONFIG_NPM1300_CHARGER=y
CONFIG_OPT3001=y
CONFIG_AUDIO_DMIC_NRFX_PDM=y
# The firmware carries an LSM6DSO-shaped descriptor with a NULL init pointer;
# enabling Zephyr's driver would add the non-matching lsm6dso_init SYS_INIT.
# CONFIG_LSM6DSO is not set

# The two APPLICATION init entries are mcumgr_handlers_init and smp_init.
# Recovered img_mgmt owners and the Bluetooth transport identify the handler
# and transport closure.  Stack/prio are exact values from the original SMP
# workqueue creation site.
CONFIG_MCUMGR=y
CONFIG_ZCBOR=y
CONFIG_ZCBOR_STOP_ON_ERROR=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=2048
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_THREAD_PRIO=3
